name: Build iOS App
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd ios
          xcodebuild -project QCSDKDemo.xcodeproj -scheme QCSDKDemo -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="Apple Development" EMBEDDED_CONTENT_CONTAINS_SWIFT=YES
      - name: Package
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/QCSDKDemo.app Payload/
          zip -r QCSDKDemo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QCSDKDemo-IPA
          path: QCSDKDemo.ipa
